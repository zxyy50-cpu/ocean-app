<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Ocean 業務助理</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="stylesheet" href="./styles/v3.css">
  <link rel="stylesheet" href="./styles/themes.css">
  <script>
    // Apply the chosen skin before first paint (default: 夏日繽紛).
    try { var skin = localStorage.getItem("ocean-skin") || "summer"; if (skin !== "classic") document.documentElement.setAttribute("data-skin", skin); }
    catch (error) { document.documentElement.setAttribute("data-skin", "summer"); }
  </script>
</head>
<body>
  <div id="app"><p style="padding:24px">載入中…</p></div>
  <noscript>這個 APP 需要啟用 JavaScript。</noscript>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
