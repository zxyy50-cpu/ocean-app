<!doctype html>
<html lang="zh-Hant">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="theme-color" content="#0f766e">
  <title>Ocean 業務助理</title>
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="stylesheet" href="./styles/app.css">
  <link rel="stylesheet" href="./styles/v3.css">
  <link rel="stylesheet" href="./styles/themes.css">
  <script>
    // Apply the chosen skin before first paint (default: 夏日繽紛).
    try { var skin = localStorage.getItem("ocean-skin") || "summer"; if (["summer", "ocean", "fantasy", "wizard", "boho", "cockpit"].indexOf(skin) < 0) skin = "summer"; document.documentElement.setAttribute("data-skin", skin); }
    catch (error) { document.documentElement.setAttribute("data-skin", "summer"); }
  </script>
</head>
<body>
  <div id="app"><p style="padding:24px" data-boot>載入中…</p></div>
  <noscript>這個 APP 需要啟用 JavaScript。</noscript>
  <script>
    // A file that failed to download stops the APP silently on 「載入中…」; say so and offer a reload.
    setTimeout(function () {
      var boot = document.querySelector("[data-boot]");
      if (!boot) return;
      boot.innerHTML = "APP 沒有載入完成（可能有檔案沒下載到）。<br>電腦版請確認已用「啟動-Ocean業務助理」開啟，再按下方重新載入。<br><br><button type=\"button\" onclick=\"location.reload()\">重新載入</button>";
    }, 15000);
  </script>
  <script type="module" src="./src/main.js"></script>
</body>
</html>
